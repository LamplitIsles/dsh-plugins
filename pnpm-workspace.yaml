packages:
  - packages/*
  # The local nanocodex package keeps its platform-neutral tool package as a
  # workspace dependency. This development link is replaced by the packed
  # artifact preparation documented by dsh-nanocodex.
  - ../nanocodex/js/nanocodex-tools

allowBuilds:
